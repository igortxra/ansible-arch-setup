---
- name: Create the `aur_builder` user
  ansible.builtin.user:
    name: aur_builder
    create_home: yes
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    create: yes
    mode: 0644
    validate: "visudo -cf %s"

- name: Ensure yay build directory exists (as user)
  file:
    path: "/tmp/builds"
    state: directory
    mode: "0777"
    owner: "{{ username }}"

- name: Clone yay repository (as user)
  git:
    repo: https://aur.archlinux.org/yay.git
    dest: "/tmp/builds/yay"
    version: master
    force: yes
    update: yes
  become_user: aur_builder

- name: Build and install yay (as user)
  command: makepkg -si --noconfirm
  args:
    chdir: "/tmp/builds/yay"
  become_user: aur_builder

- name: Sync yay database
  command: yay -Sy
  changed_when: false
